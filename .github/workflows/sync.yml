name: Sync from GameSeagull

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest repo content from GameSeagull gh-pages
        run: |
          curl -fsSL https://github.com/PerkZ999/GameSeagull/archive/refs/heads/gh-pages.tar.gz -o src.tgz
          mkdir extract && tar -xzf src.tgz -C extract --strip-components=1
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'src.tgz' ! -name 'extract' -exec rm -rf {} +
          cp -R extract/. .
          rm -rf extract src.tgz
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "[+] nothing to sync"
          else
            git commit -m "Sync from GameSeagull"
            git push
            echo "[+] synced"
          fi
